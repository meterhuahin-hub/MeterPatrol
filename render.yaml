services:
  - type: web
    name: meterpatrol
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 app:app
    healthCheckPath: /health
    disk:
      name: meterpatrol-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: METERPATROL_DB
        value: /var/data/surveys.sqlite3
      - key: COOKIE_SECURE
        value: "1"
